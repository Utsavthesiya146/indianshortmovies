name: 🚀 Build & Release iOS (App Store / TestFlight)

on:
  workflow_dispatch:
    inputs:
      upload_to_appstore:
        description: 'Upload build directly to TestFlight / App Store Connect?'
        required: true
        type: boolean
        default: false

jobs:
  ios-release:
    name: 🍎 Build App Store IPA
    runs-on: macos-latest

    steps:
      # ── 1. Checkout main repo ──────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. Checkout mobile-app branch (Capacitor code) ─────
      - name: 📱 Checkout mobile-app branch
        uses: actions/checkout@v4
        with:
          ref: mobile-app
          path: apps/capacitor_app

      # ── 3. Node.js setup ───────────────────────────────────
      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/capacitor_app/package-lock.json

      # ── 4. Install npm dependencies ────────────────────────
      - name: 📦 Install npm dependencies
        working-directory: apps/capacitor_app
        run: npm install

      # ── 5. Run mobile patch scripts ────────────────────────
      - name: 🔧 Run patch scripts
        working-directory: apps/capacitor_app
        run: |
          node patch_html.js
          node patch_js.js || echo "patch_js.js skipped"

      # ── 6. Capacitor sync iOS ──────────────────────────────
      - name: 🔄 Capacitor sync iOS
        working-directory: apps/capacitor_app
        run: npx cap sync ios

      # ── 7. CocoaPods install (if Podfile exists) ────────────
      - name: 📦 Pod install (if Podfile exists)
        working-directory: apps/capacitor_app
        run: |
          if [ -f "ios/App/Podfile" ]; then
            echo "Podfile detected, running pod install..."
            cd ios/App && pod install --repo-update
          else
            echo "No Podfile detected. Using Swift Package Manager (Capacitor 6 default)."
          fi

      # ── 8. Install Apple Certificates & Profile ───────────
      - name: 🔐 Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "❌ BUILD_CERTIFICATE_BASE64 not configured in GitHub Secrets."
            exit 1
          fi

          export CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          export PP_PATH=$RUNNER_TEMP/build_profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Safe Base64 decoding via Node.js
          node -e "fs.writeFileSync(process.env.CERTIFICATE_PATH, Buffer.from(process.env.BUILD_CERTIFICATE_BASE64.replace(/\s+/g, ''), 'base64'))"
          node -e "fs.writeFileSync(process.env.PP_PATH, Buffer.from(process.env.BUILD_PROVISION_PROFILE_BASE64.replace(/\s+/g, ''), 'base64'))"

          echo "Decoded files:"
          ls -lh $CERTIFICATE_PATH $PP_PATH

          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          # Import p12 certificate (with automatic legacy fallback for OpenSSL 3 compatibility)
          if ! security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH; then
            echo "⚠️ Standard import failed, re-exporting with legacy encryption..."
            openssl pkcs12 -in $CERTIFICATE_PATH -passin "pass:$P12_PASSWORD" -nodes -out $RUNNER_TEMP/temp.pem
            openssl pkcs12 -export -in $RUNNER_TEMP/temp.pem -out $RUNNER_TEMP/legacy.p12 -passout "pass:$P12_PASSWORD" -legacy || \
            /usr/bin/openssl pkcs12 -export -in $RUNNER_TEMP/temp.pem -out $RUNNER_TEMP/legacy.p12 -passout "pass:$P12_PASSWORD"
            security import $RUNNER_TEMP/legacy.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          echo "=== Code Signing Identities in Keychain ==="
          security find-identity -v -p codesigning $KEYCHAIN_PATH

          # Install Provisioning Profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "✅ Provisioning Profile installed successfully"

      # ── 9. Create ExportOptions.plist ──────────────────────
      - name: ⚙️ Generate ExportOptions.plist
        working-directory: apps/capacitor_app
        run: |
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.indianshortfilms.app</key>
                  <string>${{ secrets.PROVISIONING_PROFILE_NAME }}</string>
              </dict>
          </dict>
          </plist>
          EOF

      # ── 10. Archive iOS App ────────────────────────────────
      - name: 📦 Archive Xcode Project
        working-directory: apps/capacitor_app
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            BUILD_TARGET="-workspace ios/App/App.xcworkspace"
          else
            BUILD_TARGET="-project ios/App/App.xcodeproj"
          fi
          echo "Building using: $BUILD_TARGET"
          
          xcodebuild archive \
            $BUILD_TARGET \
            -scheme App \
            -configuration Release \
            -archivePath ios/App.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.PROVISIONING_PROFILE_NAME }}"

      # ── 11. Export .IPA ────────────────────────────────────
      - name: 📱 Export IPA (App Store Package)
        working-directory: apps/capacitor_app
        run: |
          mkdir -p ios/build_output
          xcodebuild -exportArchive \
            -archivePath ios/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath ios/build_output

      # ── 12. Upload IPA Artifact ────────────────────────────
      - name: ⬆️ Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: IndianShortFilms-AppStore-IPA-Run-${{ github.run_number }}
          path: apps/capacitor_app/ios/build_output/*.ipa
          retention-days: 30

      # ── 13. Upload to App Store Connect / TestFlight (Optional) ──
      - name: 🚀 Upload to TestFlight
        if: ${{ github.event.inputs.upload_to_appstore == 'true' }}
        working-directory: apps/capacitor_app
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APPSTORE_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          
          IPA_FILE=$(find ios/build_output -name "*.ipa" | head -n 1)
          echo "Uploading $IPA_FILE to App Store Connect..."
          
          xcrun altool --upload-package "$IPA_FILE" \
            --type ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" || \
          xcrun altool --upload-app \
            -f "$IPA_FILE" \
            -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

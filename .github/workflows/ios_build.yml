name: 🍎 iOS Build (Simulator)

on:
  push:
    branches: [ main, mobile-app ]
  workflow_dispatch:       # Manual trigger from GitHub UI

jobs:
  ios-build:
    name: 🔨 Build iOS App
    runs-on: macos-latest

    steps:
      # ── 1. Checkout main repo ──────────────────────────────
      - name: 📥 Checkout main repository
        uses: actions/checkout@v4

      # ── 2. Checkout mobile-app branch into capacitor folder ─
      - name: 📱 Checkout mobile-app branch (Capacitor code)
        uses: actions/checkout@v4
        with:
          ref: mobile-app
          path: apps/capacitor_app

      # ── 3. Node.js setup ───────────────────────────────────
      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/capacitor_app/package-lock.json

      # ── 4. Install npm dependencies ────────────────────────
      - name: 📦 Install npm dependencies
        working-directory: apps/capacitor_app
        run: npm install

      # ── 5. Run patch scripts (HTML/JS fixes for mobile) ────
      - name: 🔧 Run HTML patch script
        working-directory: apps/capacitor_app
        run: node patch_html.js

      - name: 🔧 Run JS patch script
        working-directory: apps/capacitor_app
        run: node patch_js.js || echo "patch_js.js skipped or not needed"

      # ── 6. Capacitor sync (generates project files) ────────
      - name: 🔄 Capacitor sync iOS
        working-directory: apps/capacitor_app
        run: npx cap sync ios

      # ── 7. Check project structure & CocoaPods if needed ──
      - name: 📦 CocoaPods install (if Podfile exists)
        working-directory: apps/capacitor_app
        run: |
          if [ -f "ios/App/Podfile" ]; then
            echo "Podfile detected, running pod install..."
            cd ios/App && pod install --repo-update
          else
            echo "No Podfile detected. Using Swift Package Manager (Capacitor 6 default)."
          fi

      # ── 8. Build for iOS Simulator (no signing needed) ───
      - name: 🏗️ Build iOS Simulator App
        working-directory: apps/capacitor_app
        run: |
          set -o pipefail
          if [ -d "ios/App/App.xcworkspace" ]; then
            BUILD_TARGET="-workspace ios/App/App.xcworkspace"
          else
            BUILD_TARGET="-project ios/App/App.xcodeproj"
          fi
          echo "Building using: $BUILD_TARGET"
          
          xcodebuild \
            $BUILD_TARGET \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath ios/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build.log | tail -50

      # ── 9. Package .app into zip for download ────────────
      - name: 📦 Package Simulator build
        working-directory: apps/capacitor_app
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/DerivedData/Build/Products -name "*.app" -not -path "*Test*" | head -1)
          echo "📱 Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found!"
            find ios/DerivedData -name "*.app" 2>/dev/null || echo "No DerivedData"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/App.app
          zip -r IndianShortFilms-iOS-Simulator.zip Payload/
          echo "✅ Packaged successfully!"
          ls -lh IndianShortFilms-iOS-Simulator.zip

      # ── 10. Upload artifact to GitHub ─────────────────────
      - name: ⬆️ Upload iOS Simulator build artifact
        uses: actions/upload-artifact@v4
        with:
          name: IndianShortFilms-iOS-Simulator-Build-${{ github.run_number }}
          path: apps/capacitor_app/IndianShortFilms-iOS-Simulator.zip
          retention-days: 30

      # ── 11. Build summary ─────────────────────────────────
      - name: ✅ Build Summary
        if: success()
        run: |
          echo "## 🎉 iOS Simulator Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| App Name | Indian Short Movies |" >> $GITHUB_STEP_SUMMARY
          echo "| Bundle ID | com.indianshortfilms.app |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Type | iOS Simulator (no cert needed) |" >> $GITHUB_STEP_SUMMARY
          echo "| Run # | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📲 How to test on Mac:" >> $GITHUB_STEP_SUMMARY
          echo "1. Download artifact ZIP from Actions tab" >> $GITHUB_STEP_SUMMARY
          echo "2. Extract → get **App.app** from Payload folder" >> $GITHUB_STEP_SUMMARY
          echo "3. Open **Xcode → Simulator** (or \`open -a Simulator\`)" >> $GITHUB_STEP_SUMMARY
          echo "4. **Drag App.app** into Simulator window" >> $GITHUB_STEP_SUMMARY

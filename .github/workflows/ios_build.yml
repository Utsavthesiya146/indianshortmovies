name: 🍎 iOS Build (Simulator)

on:
  push:
    branches: [ main, mobile-app ]
  workflow_dispatch:       # Manual trigger from GitHub UI

jobs:
  ios-build:
    name: 🔨 Build iOS App
    runs-on: macos-latest

    steps:
      # ── 1. Checkout main repo ──────────────────────────────
      - name: 📥 Checkout main repository
        uses: actions/checkout@v4

      # ── 2. Checkout mobile-app branch into capacitor folder ─
      - name: 📱 Checkout mobile-app branch (Capacitor code)
        uses: actions/checkout@v4
        with:
          ref: mobile-app
          path: apps/capacitor_app

      # ── 3. Node.js setup ───────────────────────────────────
      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/capacitor_app/package-lock.json

      # ── 4. Install npm dependencies ────────────────────────
      - name: 📦 Install npm dependencies
        working-directory: apps/capacitor_app
        run: npm install

      # ── 5. Run patch scripts (HTML/JS fixes for mobile) ────
      - name: 🔧 Run HTML patch script
        working-directory: apps/capacitor_app
        run: node patch_html.js

      - name: 🔧 Run JS patch script
        working-directory: apps/capacitor_app
        run: node patch_js.js || echo "patch_js.js skipped or not needed"

      # ── 6. Capacitor sync ──────────────────────────────────
      - name: 🔄 Capacitor sync iOS
        working-directory: apps/capacitor_app
        run: npx cap sync ios

      # ── 7. CocoaPods install ───────────────────────────────
      - name: 🍫 Install CocoaPods dependencies
        working-directory: apps/capacitor_app/ios/App
        run: pod install --repo-update

      # ── 8. Show available Xcode schemes (debug info) ───────
      - name: 🔍 List Xcode schemes
        working-directory: apps/capacitor_app
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -list

      # ── 9. Build for iOS Simulator (no signing needed) ─────
      - name: 🏗️ Build iOS Simulator App
        working-directory: apps/capacitor_app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath ios/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build | xcpretty || xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath ios/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      # ── 10. Package .app into zip for download ─────────────
      - name: 📦 Package Simulator build
        working-directory: apps/capacitor_app
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/DerivedData/Build/Products -name "*.app" | head -1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/App.app
          zip -r IndianShortFilms-iOS-Simulator.zip Payload/

      # ── 11. Upload artifact to GitHub ──────────────────────
      - name: ⬆️ Upload iOS Simulator build
        uses: actions/upload-artifact@v4
        with:
          name: IndianShortFilms-iOS-Simulator-Build-${{ github.run_number }}
          path: apps/capacitor_app/IndianShortFilms-iOS-Simulator.zip
          retention-days: 30

      # ── 12. Build summary ─────────────────────────────────
      - name: ✅ Build Summary
        run: |
          echo "## 🎉 iOS Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| App Name | Indian Short Movies |" >> $GITHUB_STEP_SUMMARY
          echo "| Bundle ID | com.indianshortfilms.app |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Type | iOS Simulator |" >> $GITHUB_STEP_SUMMARY
          echo "| Run # | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📲 How to test:" >> $GITHUB_STEP_SUMMARY
          echo "1. Download artifact ZIP from Actions tab" >> $GITHUB_STEP_SUMMARY
          echo "2. Extract to get App.app" >> $GITHUB_STEP_SUMMARY
          echo "3. Open Xcode Simulator on Mac" >> $GITHUB_STEP_SUMMARY
          echo "4. Drag App.app into Simulator window" >> $GITHUB_STEP_SUMMARY
